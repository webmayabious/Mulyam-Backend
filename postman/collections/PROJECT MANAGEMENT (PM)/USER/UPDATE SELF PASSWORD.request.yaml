$kind: http-request
url: localhost:3000/api/pm/updateSelfPassword
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \    \"oldPassword\":\"12345678\",\r

    \    \"newPassword\":\"123456\",\r

    \    \"confirmPassword\":\"123456\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{json_web_token_0c95}}"
order: 8000
